<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1013">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SetClick">
<meta name="description" content="セトリごとに曲のテンポを保存して、タップ一発で鳴らせるメトロノーム">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>SetClick</title>
<style>
/* SetClick スタジオ機材テーマ v1.6
   階層は3つだけ：パネル＝平ら／触る部品（再生系・ノブ・±・TAP・ON/OFF）＝浮く／表示窓（液晶・入力）＝沈む
   文字 11/13/16/18/24px の5段階、角丸 6/10/16px の3種、タップ領域は最小 44px
   戻し先：git tag v1.5.0（レビュー前の機材風）、v1.4.0（平らなデザイン） */
:root{
  --bg:#0f1013;
  --panel:#191b1f;
  --panel-2:#22252a;
  --line:#2e323a;
  --edge:#08090b;
  --text:#e9ebef;
  --muted:#a0a7b3;
  --dim:#6f7682;
  --accent:#ff6b3d;
  --accent-ink:#1a0b05;
  --led:#ffb23e;
  --led-glow:rgba(255,178,62,.5);
  --green:#46e27f;
  --red:#ff4f3c;
  --danger:#ff5a5f;
  --fs-xs:11px;--fs-sm:13px;--fs-md:16px;--fs-lg:18px;--fs-xl:24px;
  --r-sm:6px;--r-md:10px;--r-lg:16px;
  --tap:44px;
  --raised:linear-gradient(180deg,#353940,#272a30);
  --raised-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 0 #07080a,0 3px 6px rgba(0,0,0,.35);
  --pressed-shadow:inset 0 2px 5px rgba(0,0,0,.6);
  --sunken:inset 0 2px 8px rgba(0,0,0,.8);
  --screen:#0a0c0b;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --col:640px;
  --dock-h:0px;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:var(--fs-md);line-height:1.5;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}

/* ---------- 3階層 ---------- */
/* 浮く：実際に演奏中に触る部品だけ */
.ctl,.nudge,.step,.tap-pad,.mute{background:var(--raised);border:1px solid var(--edge);box-shadow:var(--raised-shadow);color:var(--text);transition:transform .05s,box-shadow .05s}
.ctl:active:not(:disabled),.nudge:active:not(:disabled),.step:active,.tap-pad:active,.mute:active:not(:disabled),.big-play:active,.fill-btn:active{transform:translateY(2px);box-shadow:var(--pressed-shadow)}
/* 平ら：それ以外のボタン・選択肢は細い罫線だけ */
.pill-btn,.icon-btn,.chip-tab,.sl-tools button,.meters button,.ghost-btn,.add-btn,.seg button,.song-tools button{
  min-height:var(--tap);background:transparent;border:1px solid var(--line);border-radius:var(--r-md);color:var(--muted);font-weight:700}
.pill-btn:active,.icon-btn:active,.chip-tab:active,.sl-tools button:active,.meters button:active,.ghost-btn:active,.add-btn:active,.seg button:active,
.song-tools button:active:not(:disabled){background:rgba(255,255,255,.05)}
/* 選択中はアンバーの下線で統一 */
.pill-btn[aria-pressed="true"],.chip-tab[aria-selected="true"],.meters button[aria-pressed="true"],.seg button[aria-pressed="true"],.ghost-btn.on{
  color:var(--led);border-color:rgba(255,178,62,.5);box-shadow:inset 0 -2px 0 var(--led)}
/* 沈む：表示窓 */
.lcd{background:var(--screen);border:1px solid #000;border-radius:var(--r-md);box-shadow:var(--sunken);color:var(--led)}
.seg7{height:100%;width:auto;filter:drop-shadow(0 0 3px var(--led-glow))}
.seg7 .on{fill:currentColor}
.seg7 .off{fill:currentColor;opacity:.07}

/* ---------- ヘッダ ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 8px) 0 8px}
.top-inner,.chips{max-width:var(--col);margin:0 auto}
.top-inner{display:flex;align-items:center;gap:8px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:800;font-size:var(--fs-lg)}
.pill-btn{padding:0 16px;font-size:var(--fs-sm);flex-shrink:0}
.icon-btn{width:var(--tap);display:grid;place-items:center;flex-shrink:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 16px 0;scroll-padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip-tab{flex-shrink:0;padding:0 14px;font-size:var(--fs-sm);border-radius:var(--r-sm);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:7px}
.chip-tab .n{font-size:var(--fs-xs);opacity:.6;font-family:var(--mono)}
.chip-tab.add{border-style:dashed;color:var(--dim)}
.chip-sep{flex-shrink:0;width:1px;background:var(--line);margin:8px 2px}

/* ---------- 本文 ---------- */
main{max-width:var(--col);margin:0 auto;padding:16px 16px calc(var(--dock-h) + 24px)}
.sl-head{margin:0 2px 12px}
.sl-title-row{display:flex;align-items:baseline;gap:10px}
.sl-title{margin:0;font-size:var(--fs-xl);font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-meta{font-size:var(--fs-sm);color:var(--dim);flex-shrink:0}
.sl-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sl-tools button{flex:1 1 30%;font-size:var(--fs-sm)}
.sl-danger{margin-top:32px}
.songs{list-style:none;margin:0 -16px;padding:0;border-top:1px solid var(--line)}
.song{position:relative;display:flex;align-items:stretch;border-bottom:1px solid var(--line);
  scroll-margin-top:150px;scroll-margin-bottom:calc(var(--dock-h) + 12px)}
.song-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 14px;text-align:left;min-height:68px}
.song-main:active{background:var(--panel-2)}
.song-no{width:22px;flex-shrink:0;font-size:var(--fs-sm);color:var(--dim);text-align:center;font-family:var(--mono)}
.song-body{flex:1;min-width:0}
.song-title{display:block;font-weight:700;font-size:var(--fs-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:var(--fs-sm);color:var(--muted);min-width:0}
.chip{flex-shrink:0;padding:0 6px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--muted);font-size:var(--fs-xs);line-height:18px;font-family:var(--mono)}
.song-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.song-bpm{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:var(--fs-xl);font-weight:700;line-height:1}
.song-bpm small{font-size:var(--fs-xs);color:var(--dim);margin-top:4px;font-weight:600;font-family:inherit}
.song.cued{background:var(--panel)}
/* 再生中の強調は「左のバー＋BPM の色」の2つだけ */
.song.playing{background:var(--panel)}
.song.playing::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--led)}
.song.playing .song-bpm{color:var(--led)}
.edit-mark{color:var(--dim)}
.song-tools{display:flex;align-items:center;gap:4px;padding-right:8px}
.song-tools button{width:var(--tap);display:grid;place-items:center}
.add-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px}
.add-btn{padding:0 16px;font-size:var(--fs-sm)}
.empty{text-align:center;padding:32px 16px 16px;color:var(--muted)}
.empty-title{margin:0;font-weight:700;font-size:var(--fs-md)}
.hint{font-size:var(--fs-sm);color:var(--dim);margin:6px 0 0;line-height:1.6}
.center{text-align:center}
.kbd-only{display:none}
@media (hover:hover) and (pointer:fine){.kbd-only{display:block}}

/* ---------- 拍の LED ---------- */
.beats{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.beats span{width:18px;height:18px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 35%,#3b4048,#15171b 70%);box-shadow:0 0 0 2px #08090b,inset 0 1px 2px rgba(0,0,0,.7)}
.beats span.grp{box-shadow:0 0 0 2px #08090b,0 0 0 3.5px #3a3f47}
.beats span.on{background:radial-gradient(circle at 35% 35%,#d9ffe6,var(--green) 55%,#1c6e3d);box-shadow:0 0 0 2px #08090b,0 0 10px 2px rgba(70,226,127,.5)}
.beats span.acc.on{background:radial-gradient(circle at 35% 35%,#ffd6cc,var(--red) 55%,#7e1a10);box-shadow:0 0 0 2px #08090b,0 0 12px 3px rgba(255,79,60,.55)}
.beats.big{gap:14px;padding:6px 0}
.beats.big span{width:24px;height:24px}

/* ---------- ドック（プレイヤー） ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(var(--safe-b) + 10px)}
.dock-inner{position:relative;max-width:var(--col);margin:0 auto}
.dock-row{display:flex;align-items:stretch;gap:8px;margin-top:10px}
.nudge{width:var(--tap);border-radius:var(--r-md);display:grid;place-items:center;font-size:var(--fs-xl);font-weight:500}
.dock-lcd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;min-height:76px}
.dock-info{flex:1;min-width:0}
.dock-title{font-weight:700;font-size:var(--fs-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-sub{font-size:var(--fs-sm);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpm-box{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.bpm-box .val{display:block;height:44px}
.bpm-box .val.changed{color:#ff7a45}
.bpm-box .unit{font-size:var(--fs-xs);opacity:.6;line-height:1;margin-top:5px}
.dock-mixer{margin-top:10px}
.dock-controls{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;margin-top:10px}
.ctl{min-height:52px;border-radius:var(--r-md);display:grid;place-items:center}
.ctl.play,.big-play{background:var(--accent);border:1px solid #6b240d;color:var(--accent-ink);font-weight:800;font-size:var(--fs-md);
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #3d1407}
.ctl.play.stop,.big-play.stop{background:var(--raised);border-color:var(--edge);color:var(--red);box-shadow:var(--pressed-shadow)}

#flash{position:fixed;inset:0;pointer-events:none;z-index:25;background:var(--accent);opacity:0}

/* ---------- フリー / テンポ操作 ---------- */
#freeView{display:flex;flex-direction:column;align-items:stretch;gap:16px}
.free-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(var(--safe-b) + 10px)}
.free-now{font-size:var(--fs-sm);text-align:center;padding:8px 12px}
.tempo{display:flex;flex-direction:column;gap:14px}
.big-lcd{position:relative;padding:14px 12px 10px;display:flex;flex-direction:column;align-items:center}
.lcd-digits{height:clamp(64px,21vw,96px)}
.big-num{position:absolute;inset:0;width:100%;height:100%;opacity:0;background:var(--screen);border:0;border-radius:var(--r-md);text-align:center;
  font:700 56px/1 var(--mono);color:var(--led);padding:0;margin:0;-moz-appearance:textfield;appearance:textfield}
.big-num::-webkit-outer-spin-button,.big-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.big-num:focus{opacity:1;outline:none}
.bpm-label{font-size:var(--fs-xs);opacity:.6;margin-top:6px;text-align:center}
.stepper-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{min-height:var(--tap);border-radius:var(--r-md);font-size:var(--fs-md);font-weight:700;font-family:var(--mono)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--tap);background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#07080a;box-shadow:inset 0 1px 3px rgba(0,0,0,.9)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:32px;margin-top:-13px;border-radius:var(--r-sm);border:1px solid var(--edge);
  background:linear-gradient(180deg,#dfe2e6,#9aa1ab);box-shadow:0 2px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#07080a}
input[type=range]::-moz-range-thumb{width:22px;height:32px;border-radius:var(--r-sm);border:1px solid var(--edge);background:linear-gradient(180deg,#dfe2e6,#9aa1ab)}
.tap-pad{width:100%;min-height:76px;border-radius:var(--r-lg);font-weight:800;letter-spacing:.2em;font-size:var(--fs-md)}
.tap-pad.hit{color:var(--led);box-shadow:var(--pressed-shadow),0 0 0 1px rgba(255,178,62,.6)}
.meters{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.meters button{font-size:var(--fs-sm);font-family:var(--mono);border-radius:var(--r-sm)}
.seg{display:flex;gap:6px;width:100%}
.seg button{flex:1;min-width:0;padding:0 4px;font-size:var(--fs-sm);white-space:nowrap}
/* ミキサー：ノブ（音量）＋その下の ON/OFF キー */
.mixer{display:grid;gap:8px}
.knob-cell{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;--kc:var(--led)}
.knob-cell[data-k="accent"]{--kc:#ff5a3c}
.knob-cell[data-k="beat"]{--kc:#e8ebf0}
.knob-cell[data-k="e8"]{--kc:#ffb23e}
.knob-cell[data-k="t3"]{--kc:#4fd1ff}
.knob-cell[data-k="s16"]{--kc:#b58dff}
.knob{width:64px;height:64px;touch-action:none;cursor:ns-resize;border-radius:50%}
.knob svg{width:100%;height:100%;overflow:visible}
.k-arc-bg{fill:none;stroke:#07080a;stroke-width:6;stroke-linecap:round}
.k-arc{fill:none;stroke:var(--kc);stroke-width:6;stroke-linecap:round}
.k-ptr{stroke:#1d2025;stroke-width:3.6;stroke-linecap:round}
.mute{width:100%;min-height:var(--tap);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:var(--fs-sm);font-weight:700;color:var(--dim);white-space:nowrap;padding:0 4px}
.mute::before{content:"";width:7px;height:7px;border-radius:50%;background:#2a2d33;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);flex-shrink:0}
.mute[aria-pressed="true"]{color:var(--text)}
.mute[aria-pressed="true"]::before{background:var(--kc);box-shadow:0 0 6px var(--kc)}
.knob-val{font-size:var(--fs-xs);color:var(--dim);font-family:var(--mono);margin-top:-2px}
.mixer.compact .knob{width:44px;height:44px}
.mixer.compact .knob-val{display:none}
.mixer.compact .mute{font-size:var(--fs-xs);gap:5px}
.mixer.disabled{opacity:.45}
.mixer.disabled .knob{cursor:default}
.field{display:block;width:100%;min-width:0}
.field-label{font-size:var(--fs-sm);color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.field-label span{color:var(--dim);font-weight:500}
.big-play{width:100%;min-height:56px;border-radius:var(--r-lg);font-size:var(--fs-lg)}
.ghost-btn{width:100%;padding:0 14px;font-size:var(--fs-md);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px}
.danger-btn{width:100%;min-height:var(--tap);border-radius:var(--r-md);color:var(--danger);font-weight:700;border:1px solid rgba(255,90,95,.35);background:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- シート / ダイアログ ---------- */
.sheet-root{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:var(--col);max-height:calc(100dvh - var(--safe-t) - 16px);overflow:auto;overscroll-behavior:contain;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:0 -10px 30px rgba(0,0,0,.5);padding:6px 18px calc(var(--safe-b) + 22px);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:var(--fs-md);font-weight:800;text-align:center}
.sheet-head > :first-child{justify-self:start}
.sheet-head > :last-child{justify-self:end}
.text-btn{min-height:var(--tap);padding:0 6px;border-radius:var(--r-sm);font-weight:700;color:var(--muted)}
.text-btn.primary{color:var(--led)}
.stack{display:flex;flex-direction:column;gap:20px}
.input{width:100%;min-height:var(--tap);padding:10px 14px;border-radius:var(--r-md);background:#0c0e11;border:1px solid var(--line);color:var(--text);font-size:var(--fs-md);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.input:focus{outline:none;border-color:rgba(255,178,62,.6)}
textarea.input{resize:vertical;line-height:1.6}
.dlg-title{margin:6px 0 6px;font-size:var(--fs-lg)}
.dlg-msg{margin:0 0 14px;color:var(--muted);font-size:var(--fs-sm)}
.dlg .input{margin:6px 0 14px}
.dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.fill-btn{min-height:var(--tap);border-radius:var(--r-md);font-weight:800;background:var(--accent);border:1px solid #6b240d;color:var(--accent-ink)}
.fill-btn.danger{background:var(--danger);border-color:#4a0e10;color:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:var(--fs-sm);font-weight:700}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.parse-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm)}
.parse-list li{display:flex;gap:10px;padding:8px 12px;border-radius:var(--r-sm);background:#0c0e11}
.parse-list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.parse-list .m{color:var(--muted);flex-shrink:0}
.parse-list .warn{color:var(--led)}
.slider-row{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:10px;font-size:var(--fs-sm);font-weight:700}
.slider-row .v{text-align:right;color:var(--muted);font-family:var(--mono)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 12px);z-index:60;
  background:var(--screen);border:1px solid #000;color:var(--led);min-height:var(--tap);
  padding:0 16px;border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:700;display:flex;gap:14px;align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.6);width:max-content;max-width:calc(100% - 32px)}
.toast button{min-height:var(--tap);color:var(--text);font-weight:800;flex-shrink:0;text-decoration:underline}

@keyframes up{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-backdrop{animation:none}}
@media (min-width:720px){
  .sheet-root{align-items:center}

<script>
'use strict';
const APP_VERSION = '1.8.1';
const KEY = 'setclick:v1';
const BPM_MIN = 20, BPM_MAX = 300;
const DEBUG = /[?&]debug\b/.test(location.search);

// 拍子。x/8 のうち 3 の倍数（6/8・9/8・12/8）は付点4分を1拍として数える
const METERS = ['2/4', '3/4', '4/4', '5/4', '6/4', '7/4', '5/8', '6/8', '7/8', '9/8', '12/8'];
const UNIT_LABEL = { simple: '4分音符 = BPM', compound: '付点4分 = BPM', odd8: '8分音符 = BPM' };
const SOUNDS = [{ v: 'click', label: 'クリック' }, { v: 'wood', label: 'ウッド' }, { v: 'hat', label: 'ハイハット' }];
const COUNT_MODES = [{ v: 0, label: '鳴らし続ける' }, { v: 1, label: '1小節で停止' }, { v: 2, label: '2小節で停止' }];

// ミキサー（Dr.Beat 式）。各レイヤーの音量 0〜1 を曲ごとに持ち、0 なら鳴らない。複数同時に鳴らせる
const MIX_KEYS = ['accent', 'beat', 'e8', 't3', 's16'];
const LAYERS = {
  simple: [['accent', '1拍目'], ['beat', '表'], ['e8', '8分裏'], ['t3', '3連'], ['s16', '16分']],
  compound: [['accent', '1拍目'], ['beat', '表'], ['e8', '8分'], ['s16', '16分']],
  odd8: [['accent', '1拍目'], ['beat', '表'], ['s16', '16分']],
};
// 1拍を何ティックに刻むか（8分・3連・16分がすべて乗る最小公倍数）と、各レイヤーが鳴るティック位置
const GRID = { simple: 12, compound: 6, odd8: 2 };
const TICKS = {
  simple: { e8: [6], t3: [4, 8], s16: [3, 6, 9] },
  compound: { e8: [2, 4], s16: [1, 2, 3, 4, 5] },
  odd8: { s16: [1] },
};
// 旧形式（裏を1つ選ぶ方式 sub）からの移行用
const SUB_KEYS = ['none', '8th', 'triplet', '16th'];

const ICON = {
  play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6v14.8a1 1 0 0 0 1.53.85l11.8-7.4a1 1 0 0 0 0-1.7L8.53 3.75A1 1 0 0 0 7 4.6z"/></svg>',
  stop: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="4.5" y="4.5" width="15" height="15" rx="2.5"/></svg>',
  up: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  note: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M14 3v11.3A3.5 3.5 0 1 0 16 17.5V7h4V3z"/></svg>',
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clampBpm = v => clamp(Math.round(Number(v) || 0), BPM_MIN, BPM_MAX);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ================= 拍子 ================= */
function meterInfo(ts) {
  const [n, d] = String(ts).split('/').map(Number);
  if (d === 8 && n % 3 === 0) return { n, d, kind: 'compound', pulses: n / 3, dpb: 3 };
  if (d === 8) return { n, d, kind: 'odd8', pulses: n, dpb: 1 };
  return { n, d, kind: 'simple', pulses: n, dpb: 1 };
}
const kindOf = ts => meterInfo(ts).kind;
const layersOf = ts => LAYERS[kindOf(ts)];
// 拍子の定番ミックス（6/8 系は8分を刻むのが基本）
const defaultMix = ts => ({ accent: 1, beat: 1, e8: kindOf(ts) === 'compound' ? 0.8 : 0, t3: 0, s16: 0 });
const mixEq = (a, b) => MIX_KEYS.every(k => Math.round((a?.[k] ?? 0) * 100) === Math.round((b?.[k] ?? 0) * 100));
// 「4/4・8分裏・3連」のような表示用（拍の間に鳴るレイヤーだけ列挙）
const meterText = m => m.ts;

// 7セグ LED 表示（SVG）。消えているセグメントも薄く描いて実機っぽくする。オフラインでも使えるようフォントは使わない
const SEG_ON = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '' };
const SEG_PATH = (() => {
  const h = 2.2, L = 2.6, R = 21.4, T = 2.6, M = 22, B = 41.4, g = 0.9;
  const H = (x1, x2, y) => `M${x1} ${y}L${x1 + h} ${y - h}L${x2 - h} ${y - h}L${x2} ${y}L${x2 - h} ${y + h}L${x1 + h} ${y + h}Z`;
  const V = (x, y1, y2) => `M${x} ${y1}L${x + h} ${y1 + h}L${x + h} ${y2 - h}L${x} ${y2}L${x - h} ${y2 - h}L${x - h} ${y1 + h}Z`;
  return { a: H(L + g, R - g, T), g: H(L + g, R - g, M), d: H(L + g, R - g, B), f: V(L, T + g, M - g), b: V(R, T + g, M - g), e: V(L, M + g, B - g), c: V(R, M + g, B - g) };
})();
function seg7(value, width = 3) {
  const s = String(value ?? '').slice(-width).padStart(width, ' ');
  let out = `<svg class="seg7" viewBox="-4 0 ${width * 28 + 4} 44" aria-hidden="true"><g transform="skewX(-7)">`;
  [...s].forEach((ch, i) => {
    const on = SEG_ON[ch] ?? '';
    out += `<g transform="translate(${i * 28 + 4} 0)">`;
    for (const k of 'abcdefg') out += `<path d="${SEG_PATH[k]}" class="${on.includes(k) ? 'on' : 'off'}"/>`;
    out += '</g>';
  });
  return out + '</g></svg>';
}
// 曲の設定 → 発音エンジン用のパラメータ（拍数・1拍のティック数・表示ドットの束ね方）。ミックスは全曲共通のミキサー
function toEngine(m) {
  const mi = meterInfo(m.ts);
  return { bpm: m.bpm, beats: mi.pulses, grid: GRID[mi.kind], dpb: mi.dpb, kindM: mi.kind, ts: m.ts, mix: effMix() };
}

/* ================= データ ================= */
let MIG = { accent: 1, beat: 1, sub: 0.8 }; // 旧データの音量バランス（load 中だけ旧設定値を入れる）
function mixFromSub(ts, sub) {
  const kind = kindOf(ts);
  const m = { accent: MIG.accent, beat: MIG.beat, e8: 0, t3: 0, s16: 0 };
  const k = { '8th': 'e8', triplet: kind === 'compound' ? 'e8' : 't3', '16th': 's16' }[sub];
  if (k && (kind !== 'odd8' || k === 's16')) m[k] = MIG.sub;
  return m;
}
function sanitizeMix(m) {
  if (Array.isArray(m)) m = Object.fromEntries(MIX_KEYS.map((k, i) => [k, Number(m[i]) / 100])); // 共有リンクは 0〜100 の配列
  if (!m || typeof m !== 'object') return null;
  const o = {};
  for (const k of MIX_KEYS) { const v = Number(m[k]); o[k] = Number.isFinite(v) ? clamp(Math.round(v * 100) / 100, 0, 1) : 0; }
  return o;
}
function fixMeter(o) {
  let ts = typeof o.ts === 'string' && METERS.includes(o.ts) ? o.ts : null;
  if (!ts) { const b = Math.round(Number(o.beats)); ts = METERS.includes(`${b}/4`) ? `${b}/4` : '4/4'; }
  let mix = sanitizeMix(o.mix);
  if (!mix) {
    const sub = SUB_KEYS.includes(o.sub) ? o.sub : ({ 1: 'none', 2: '8th', 3: 'triplet', 4: '16th' }[Number(o.sub)] || 'none');
    mix = mixFromSub(ts, sub);
  }
  return { ts, mix };
}
function sanitizeSong(o) {
  if (!o || typeof o !== 'object') return null;
  const bpm = Number(o.bpm);
  if (!Number.isFinite(bpm)) return null;
  return {
    id: typeof o.id === 'string' && o.id ? o.id : uid(),
    title: String(o.title ?? '').trim().slice(0, 80) || '無題',
    bpm: clampBpm(bpm),
    ...fixMeter(o),
    note: String(o.note ?? '').trim().slice(0, 140),
  };
}
function sanitizeSetlist(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.songs)) return null;
  return {
    id: typeof o.id === 'string' && o.id ? o.id : uid(),
    name: String(o.name ?? '').trim().slice(0, 60) || '無題のセトリ',
    songs: o.songs.map(sanitizeSong).filter(Boolean).slice(0, 300),
  };
}
const defaultLevels = () => ({ accent: 1, beat: 1, e8: 0.7, t3: 0.7, s16: 0.7 });
const defaultSettings = () => ({ sound: 'click', volume: 0.9, countBars: 0, flash: false, levels: defaultLevels() });
function defaultState() {
  const song = (title, bpm, ts, mix, note) => ({ id: uid(), title, bpm, ts, mix: { ...defaultMix(ts), ...mix }, note });
  const sl = { id: uid(), name: 'サンプル', songs: [
    song('アップテンポの曲', 180, '4/4', {}, ''),
    song('ミドルテンポの曲', 120, '4/4', { e8: 0.6 }, ''),
    song('ワルツ', 150, '3/4', {}, ''),
    song('バラード', 58, '6/8', {}, ''),
  ] };
  return { v: 1, setlists: [sl], currentId: sl.id, free: { bpm: 120, ts: '4/4', mix: defaultMix('4/4') }, settings: defaultSettings() };
}
function load() {
  let d = null;
  try { const raw = localStorage.getItem(KEY); if (raw) d = JSON.parse(raw); } catch {}
  if (!d || !Array.isArray(d.setlists)) return defaultState();
  const num01 = (v, dflt) => clamp(Number.isFinite(Number(v)) ? Number(v) : dflt, 0, 1);
  // v1.3 以前は「裏を1つ選ぶ＋設定の全体バランス」だった → 各曲のミックスに焼き込む
  const old = d.settings && typeof d.settings === 'object' ? d.settings : {};
  MIG = { accent: old.accent === false ? 0 : num01(old.mix?.accent, 1), beat: num01(old.mix?.beat, 1), sub: num01(old.mix?.sub, 0.8) };
  const setlists = d.setlists.map(sanitizeSetlist).filter(Boolean);
  const free = { bpm: clampBpm(d.free?.bpm ?? 120), ...fixMeter(d.free || {}) };
  MIG = { accent: 1, beat: 1, sub: 0.8 };
  const st = {
    v: 1,
    setlists: setlists.length ? setlists : [{ id: uid(), name: 'セトリ1', songs: [] }],
    currentId: d.currentId,
    free,
    settings: defaultSettings(),
  };
  if (!st.setlists.some(s => s.id === st.currentId)) st.currentId = st.setlists[0].id;
  const s = st.settings;
  if (SOUNDS.some(x => x.v === old.sound)) s.sound = old.sound;
  s.volume = num01(old.volume, 0.9);
  s.flash = old.flash === true;
  if ([0, 1, 2].includes(old.countBars)) s.countBars = old.countBars;
  const lv = old.levels && typeof old.levels === 'object' ? old.levels : {};
  s.levels = Object.fromEntries(MIX_KEYS.map(k => [k, num01(lv[k], defaultLevels()[k])]));
  return st;
}
let S = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { if (!saveWarned) { saveWarned = true; toast('この端末に保存できませんでした（プライベートモード？）'); } }
}
const cur = () => S.setlists.find(s => s.id === S.currentId) || S.setlists[0];
const findSong = (setlistId, songId) => S.setlists.find(s => s.id === setlistId)?.songs.find(x => x.id === songId) || null;
function uniqueName(name) {
  if (!S.setlists.some(s => s.name === name)) return name;
  for (let i = 2; ; i++) { const n = `${name} (${i})`; if (!S.setlists.some(s => s.name === n)) return n; }
}
function nextSetlistName() {
  for (let i = S.setlists.length + 1; ; i++) { const n = `セトリ${i}`; if (!S.setlists.some(s => s.name === n)) return n; }
}

/* ================= 音 ================= */
// Web Audio の先読みスケジューラ。25ms ごとに「120ms 先まで」の発音を AudioContext の時計で予約する。
// setTimeout で直接鳴らすとメインスレッドの負荷でテンポが揺れるため、この方式にしている。
const Engine = (() => {
  let ctx = null, master = null, gains = null, worker = null, bufs = null, keepAlive = null, fallbackTimer = 0, analyser = null;
  let src = null;          // { kind: 'song'|'free'|'preview', setlistId, songId, title, bpm, beats, grid, dpb, kindM, ts, mix }
  let active = false;      // 再生中（UI 上）
  let scheduling = false;  // まだ先のノートを予約するか
  let anchorTime = 0, anchorIdx = 0, idx = 0, stopIdx = Infinity, endTimer = 0;
  let scheduled = [];
  const queue = [];        // 画面表示用（発音時刻つき）
  const log = [];          // ?debug のときだけ使う
  const LOOKAHEAD = 0.12;
  // 再生開始の1拍目を何秒先に置くか。予約が処理される前に時刻が過ぎない最小限（音声処理の数ブロック分）
  const START_LEAD = 0.02;
  const listeners = new Set();
  const emit = () => listeners.forEach(f => f());

  function makeBuffers() {
    const sr = ctx.sampleRate, TAU = Math.PI * 2;
    const make = (dur, fn) => {
      const n = Math.max(1, Math.floor(sr * dur));
      const b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = fn(i / sr) * Math.min(1, i / 24);
      return b;
    };
    const beep = (f, a, tau) => t => a * Math.sin(TAU * f * t) * Math.exp(-t / tau);
    const wood = (f, a, tau) => t => a * (0.75 * Math.sin(TAU * f * t) + 0.25 * Math.sin(TAU * f * 2.71 * t)) * Math.exp(-t / tau);
    const noise = (a, tau) => { let prev = 0; return t => { const w = Math.random() * 2 - 1; const hp = (w - prev) * 0.5; prev = w; return a * hp * Math.exp(-t / tau); }; };
    const mix = (...fs) => t => fs.reduce((s, f) => s + f(t), 0);
    return {
      click: { accent: make(0.09, beep(1760, 0.95, 0.02)), beat: make(0.08, beep(1175, 0.8, 0.018)), sub: make(0.06, beep(880, 0.55, 0.012)) },
      wood: { accent: make(0.12, wood(1250, 0.95, 0.026)), beat: make(0.1, wood(880, 0.85, 0.022)), sub: make(0.08, wood(700, 0.55, 0.016)) },
      hat: { accent: make(0.12, mix(noise(0.7, 0.035), beep(1600, 0.3, 0.02))), beat: make(0.08, noise(0.85, 0.025)), sub: make(0.06, noise(0.55, 0.014)) },
    };
  }
  const volGain = () => Math.pow(S.settings.volume, 1.3);
  function init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    try { ctx = new AC({ latencyHint: 'interactive' }); } catch { ctx = new AC(); }
    master = ctx.createGain();
    master.gain.value = volGain();
    master.connect(ctx.destination);
    if (DEBUG) { analyser = ctx.createAnalyser(); analyser.fftSize = 2048; master.connect(analyser); }
    // ミキサーの各レイヤー（1拍目・表・8分裏・3連・16分）ごとにゲインを分ける。再生中のフェーダー操作が即座に効く
    gains = {};
    for (const k of MIX_KEYS) { gains[k] = ctx.createGain(); gains[k].gain.value = 0; gains[k].connect(master); }
    bufs = makeBuffers();
    // タイマーは Worker に置く（メインスレッドが重くても tick が遅れにくい）
    try {
      const code = "let t=null;onmessage=e=>{clearInterval(t);t=null;if(e.data==='start')t=setInterval(()=>postMessage(0),25)}";
      worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
      worker.onmessage = tick;
    } catch { worker = null; }
  }
  function timerStart() { if (worker) worker.postMessage('start'); else { clearInterval(fallbackTimer); fallbackTimer = setInterval(tick, 25); } }
  function timerStop() { if (worker) worker.postMessage('stop'); clearInterval(fallbackTimer); }
  function silentWavUrl() {
    const sr = 8000, n = 2000, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  // ユーザー操作の中で呼ぶ（ブラウザの自動再生制限の解除）
  function unlock() {
    if (!ctx) init();
    try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch {}
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    const n = ctx.createBufferSource();
    n.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
    n.connect(ctx.destination); n.start(0);
    // 古い iOS はマナーモード中に Web Audio が鳴らないので、無音の audio 要素を流して回避
    if (isIOS && !('audioSession' in navigator)) {
      if (!keepAlive) { keepAlive = new Audio(silentWavUrl()); keepAlive.loop = true; }
      keepAlive.play().catch(() => {});
    }
  }
  const interval = () => 60 / src.bpm / src.grid; // 1ティックの長さ（1拍 = grid ティック）
  function tick() {
    if (!scheduling || !ctx) return;
    const horizon = ctx.currentTime + LOOKAHEAD;
    const iv = interval();
    for (;;) {
      const t = anchorTime + (idx - anchorIdx) * iv;
      if (t > horizon) break;
      if (idx >= stopIdx) {
        scheduling = false; timerStop();
        endTimer = setTimeout(finish, Math.max(0, (t - ctx.currentTime) * 1000));
        break;
      }
      if (t >= ctx.currentTime - 0.02) scheduleNote(idx, t); // 復帰直後などで過ぎた分はまとめて鳴らさない
      idx++;
    }
    if (scheduled.length > 48) { const now = ctx.currentTime; scheduled = scheduled.filter(s => s.time > now - 0.2); }
  }
  // ティック i を鳴らすか決める。拍頭は 1拍目（アクセント）か表、それ以外はそのティックに乗るレイヤーのうち一番大きいもの
  function scheduleNote(i, t) {
    const G = src.grid, perBar = src.beats * G;
    const inBar = i % perBar, beat = Math.floor(inBar / G), tk = inBar % G;
    let layer = null, vol = 0;
    if (tk === 0) {
      if (beat === 0 && src.mix.accent > 0) { layer = 'accent'; vol = src.mix.accent; }
      else { layer = 'beat'; vol = src.mix.beat; }
    } else {
      const tt = TICKS[src.kindM];
      for (const k in tt) if (tt[k].includes(tk) && src.mix[k] > vol) { vol = src.mix[k]; layer = k; }
    }
    const kind = layer === 'accent' ? 'accent' : tk === 0 ? 'beat' : 'sub';
    // 表示用：拍（6/8 などは8分）ごとにドットを進める。音が 0 でも表示は進める
    const tpd = G / src.dpb;
    if (tk % tpd === 0) {
      queue.push({ time: t, kind, dot: beat * src.dpb + tk / tpd });
      if (queue.length > 128) queue.splice(0, queue.length - 128);
    }
    if (!layer || vol <= 0) return;
    const n = ctx.createBufferSource();
    n.buffer = bufs[S.settings.sound][kind];
    n.connect(gains[layer]);
    n.start(t);
    scheduled.push({ n, time: t });
    if (DEBUG) { log.push({ t, kind, layer, bpm: src.bpm }); if (log.length > 500) log.shift(); }
  }
  function applyMixGains(smooth) {
    for (const k of MIX_KEYS) {
      const v = src?.mix?.[k] ?? 0;
      if (smooth) gains[k].gain.setTargetAtTime(v, ctx.currentTime, 0.015); else gains[k].gain.setValueAtTime(v, ctx.currentTime);
    }
  }
  function cancelScheduled() {
    const now = ctx ? ctx.currentTime : 0;
    for (const s of scheduled) if (s.time > now) { try { s.n.stop(); } catch {} }
    scheduled = [];
    queue.length = 0;
  }
  function finish() {
    endTimer = 0; active = false; scheduling = false;
    timerStop();
    if (keepAlive) keepAlive.pause();
    wake(false);
    emit();
  }
  function start(next) {
    unlock();
    cancelScheduled();
    clearTimeout(endTimer); endTimer = 0;
    src = { ...next, mix: { ...next.mix } };
    applyMixGains(false);
    active = true; scheduling = true;
    idx = 0; anchorIdx = 0;
    anchorTime = ctx.currentTime + START_LEAD;
    const bars = S.settings.countBars;
    stopIdx = bars && src.kind === 'song' ? bars * src.beats * src.grid : Infinity;
    timerStart(); tick();
    wake(true);
    emit();
  }
  function stop() {
    if (!active) return;
    clearTimeout(endTimer); endTimer = 0;
    active = false; scheduling = false;
    timerStop(); cancelScheduled();
    if (keepAlive) keepAlive.pause();
    wake(false);
    emit();
  }
  // 再生中のテンポ変更：次に鳴る予定の拍の時刻を起点に組み直す（位相を保ったまま滑らかに変わる）
  function setBpm(b) {
    if (!src) return;
    b = clampBpm(b);
    if (b === src.bpm) return;
    if (active && scheduling && ctx) {
      const tNext = anchorTime + (idx - anchorIdx) * interval();
      src.bpm = b; anchorTime = tNext; anchorIdx = idx;
    } else src.bpm = b;
    emit();
  }
  // ミキサー操作：再生中でも即反映（すでに予約済みの音にもゲイン経由で効く。0 から上げたレイヤーは次のティックから鳴る）
  function setMix(mix) {
    if (!src) return;
    src.mix = { ...mix };
    if (ctx) applyMixGains(true);
    emit();
  }
  function setVolume() {
    if (!ctx) return;
    master.gain.setTargetAtTime(volGain(), ctx.currentTime, 0.01);
  }
  function blip(kind = 'accent') {
    unlock();
    const n = ctx.createBufferSource();
    n.buffer = bufs[S.settings.sound][kind];
    n.connect(master); n.start(ctx.currentTime + 0.02);
  }
  // 画面表示用：出力遅延ぶん遅らせて、実際に音が出た拍を取り出す
  function pull() {
    if (!ctx || !queue.length) return null;
    const now = ctx.currentTime - (ctx.outputLatency || 0) - (ctx.baseLatency || 0);
    let hit = null;
    while (queue.length && queue[0].time <= now) hit = queue.shift();
    return hit;
  }
  function resumeIfNeeded() { if (ctx && active && ctx.state !== 'running') ctx.resume().catch(() => {}); }
  return {
    start, stop, setBpm, setMix, setVolume, blip, pull, resumeIfNeeded,
    on: f => { listeners.add(f); return () => listeners.delete(f); },
    get src() { return src; },
    get active() { return active; },
    get state() { return ctx ? ctx.state : 'none'; },
    // 音声がすでに動いていて、ユーザー操作なしでも即座に鳴らせるか。
    // 古い iOS はマナーモード対策の無音 audio を操作の中で再生し直す必要があるので対象外
    get ready() { return !!ctx && ctx.state === 'running' && !(isIOS && !('audioSession' in navigator)); },
    get time() { return ctx ? ctx.currentTime : 0; },
    get log() { return log; },
    // ?debug 専用：出力のピーク値（音が実際に出ているかの検証用）
    peak() { if (!analyser) return null; const a = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(a); return a.reduce((m, v) => Math.max(m, Math.abs(v)), 0); },
  };
})();

let wakeSentinel = null;
async function wake(on) {
  try {
    if (on) {
      if (wakeSentinel || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      const s = await navigator.wakeLock.request('screen');
      if (!Engine.active) { s.release(); return; }
      wakeSentinel = s;
      s.addEventListener('release', () => { if (wakeSentinel === s) wakeSentinel = null; });
    } else if (wakeSentinel) {
      const s = wakeSentinel; wakeSentinel = null; await s.release();
    }
  } catch { /* 省電力モード等で拒否されても再生は続ける */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Engine.active) { Engine.resumeIfNeeded(); wake(true); }
});

/* ================= 画面 ================= */
const ui = { view: 'setlist', edit: false, cuedId: null };
let freeTempo = null;

const meterChips = s => `<span class="chip">${s.ts}</span>`;
const playingSongId = () => (Engine.active && Engine.src?.kind === 'song' ? Engine.src.songId : null);

function render() {
  const sl = cur();
  if (!sl.songs.some(s => s.id === ui.cuedId)) ui.cuedId = sl.songs[0]?.id ?? null;
  const editBtn = $('#editBtn');
  editBtn.textContent = ui.edit ? '完了' : '編集';
  editBtn.setAttribute('aria-pressed', String(ui.edit));
  editBtn.hidden = ui.view !== 'setlist';
  $('#setlistView').hidden = ui.view !== 'setlist';
  $('#freeView').hidden = ui.view !== 'free';
  $('#dock').hidden = ui.view !== 'setlist';
  $('#freeBar').hidden = ui.view !== 'free';
  $('#slTitle').textContent = sl.name;
  $('#slMeta').textContent = `${sl.songs.length}曲`;
  $('#slTools').hidden = !ui.edit;
  $('#slDanger').hidden = !ui.edit;
  $('#slTools [data-x="left"]').disabled = S.setlists.indexOf(sl) === 0;
  $('#slTools [data-x="right"]').disabled = S.setlists.indexOf(sl) === S.setlists.length - 1;
  renderChips();
  renderList();
  renderDock();
  renderFree();
  measureDock();
}

function renderChips() {
  const nav = $('#chips');
  nav.innerHTML =
    `<button class="chip-tab" role="tab" data-view="free" aria-selected="${ui.view === 'free'}">${ICON.note}フリー</button><span class="chip-sep"></span>` +
    S.setlists.map(sl => `<button class="chip-tab" role="tab" data-sl="${sl.id}" aria-selected="${ui.view === 'setlist' && sl.id === S.currentId}">${esc(sl.name)}<span class="n">${sl.songs.length}</span></button>`).join('') +
    '<button class="chip-tab add" data-x="new" aria-label="新しいセトリ">＋ セトリ</button>';
  // 選択中のタブを横スクロールの中央へ（画面幅によらず、タブ列の中での位置で計算する）
  const sel = nav.querySelector('[aria-selected="true"]');
  if (sel) {
    const nr = nav.getBoundingClientRect(), cr = sel.getBoundingClientRect();
    nav.scrollLeft += (cr.left + cr.width / 2) - (nr.left + nr.width / 2);
  }
}

function renderList() {
  const sl = cur(), pid = playingSongId();
  const list = $('#songList');
  list.classList.toggle('editing', ui.edit);
  list.innerHTML = sl.songs.map((s, i) => `
    <li class="song${s.id === pid ? ' playing' : ''}${!pid && s.id === ui.cuedId ? ' cued' : ''}" data-id="${s.id}">
      <button class="song-main" data-act="${ui.edit ? 'edit' : 'toggle'}" aria-label="${esc(s.title)} ${s.bpm} BPM${ui.edit ? ' を編集' : ''}">
        <span class="song-no num">${i + 1}</span>
        <span class="song-body">
          <span class="song-title">${esc(s.title)}</span>
          <span class="song-meta">${meterChips(s)}${s.note ? `<span class="song-note">${esc(s.note)}</span>` : ''}</span>
        </span>
        ${ui.edit ? `<span class="edit-mark">${ICON.edit}</span>` : ''}
        <span class="song-bpm">${s.bpm}<small>BPM</small></span>
      </button>
      ${ui.edit ? `<span class="song-tools">
        <button data-act="up" aria-label="上へ移動" ${i === 0 ? 'disabled' : ''}>${ICON.up}</button>
        <button data-act="down" aria-label="下へ移動" ${i === sl.songs.length - 1 ? 'disabled' : ''}>${ICON.down}</button>
      </span>` : ''}
    </li>`).join('');
  $('#emptyState').hidden = sl.songs.length > 0;
}

function updateMarks() {
  const pid = playingSongId();
  $$('#songList li').forEach(li => {
    li.classList.toggle('playing', li.dataset.id === pid);
    li.classList.toggle('cued', !pid && li.dataset.id === ui.cuedId);
  });
}

// p = toEngine() の戻り値。拍（6/8 なら8分）ごとのドットを並べる
function ensureDots(el, p) {
  const count = p.beats * p.dpb;
  const accent = (p.mix?.accent ?? 0) > 0 && p.beats > 1;
  const key = `${p.beats}:${p.dpb}:${accent}`;
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = Array.from({ length: count }, (_, i) =>
    `<span class="${i === 0 && accent ? 'acc' : (p.dpb > 1 && i % p.dpb === 0 ? 'grp' : '')}"></span>`).join('');
}
function clearDots() { $$('.beats span.on').forEach(d => d.classList.remove('on')); }

// ドックの基準曲（再生中の曲がこのセトリにあればそれ、なければ選択中の曲）
function baseIndex() {
  const sl = cur(), src = Engine.src;
  const id = Engine.active && src?.kind === 'song' && src.setlistId === sl.id ? src.songId : ui.cuedId;
  return sl.songs.findIndex(s => s.id === id);
}

// プレイヤーが対象にしている曲：再生中の曲（別のセトリでも）か、選択中の曲
function dockTarget() {
  const src = Engine.src;
  if (Engine.active && src?.kind === 'song') {
    const song = findSong(src.setlistId, src.songId);
    if (song) return { setlistId: src.setlistId, song };
  }
  const s = cur().songs.find(x => x.id === ui.cuedId);
  return s ? { setlistId: cur().id, song: s } : null;
}
const liveSrc = () => (Engine.active && Engine.src && Engine.src.kind !== 'preview' ? Engine.src : null);

function renderDock() {
  const sl = cur(), src = liveSrc(), t = dockTarget();
  let title, p, kind = 'song';
  if (src && src.kind === 'free') { p = src; kind = 'free'; title = 'フリー'; }
  else if (src) { p = src; title = src.title; }
  else if (t) { p = toEngine(t.song); title = t.song.title; }
  else { title = '曲を追加してください'; p = toEngine({ bpm: null, ts: '4/4' }); }
  const i = baseIndex();
  const next = i >= 0 ? sl.songs[i + 1] : null;
  // 置いて見る距離で読むもの：曲名・BPM・次の曲・拍ランプ
  const parts = [];
  if (kind === 'song') {
    if (next) parts.push(`次: ${next.title}`);
    else if (i >= 0 && i === sl.songs.length - 1) parts.push('最後の曲');
    if (S.settings.countBars) parts.push(COUNT_MODES[S.settings.countBars].label);
  } else parts.push(meterText(p));
  $('#dockTitle').textContent = title;
  $('#dockSub').textContent = parts.join('　');
  const val = $('#dockBpm');
  const shown = p.bpm ?? '---';
  if (val.dataset.v !== String(shown)) { val.dataset.v = shown; val.innerHTML = seg7(shown, 3); }
  val.setAttribute('aria-label', p.bpm ? `${p.bpm} BPM` : 'BPM なし');
  // ± は再生中だけ・その場限り（保存しない）。曲の BPM を変えるのは編集画面だけ
  val.classList.toggle('changed', !!(src && src.kind === 'song' && t && p.bpm !== t.song.bpm));
  $('#dockUnit').textContent = `BPM・${p.ts}`;
  renderMixer($('#dockMixer'), p.ts);
  $('#bpmMinus').disabled = $('#bpmPlus').disabled = !src;
  const play = $('#playBtn');
  play.classList.toggle('stop', !!src);
  play.innerHTML = src ? `${ICON.stop}<span>停止</span>` : `${ICON.play}<span>再生</span>`;
  play.setAttribute('aria-label', src ? '停止' : '再生');
  play.disabled = !src && !sl.songs.length;
  $('#prevBtn').disabled = !(i > 0);
  $('#nextBtn').disabled = !(i >= 0 && i < sl.songs.length - 1);
  ensureDots($('#dockBeats'), p);
}

function renderFree() {
  if (!freeTempo) return;
  freeTempo.sync();
  const src = Engine.src, active = Engine.active;
  const live = active && src?.kind !== 'preview';
  const btn = $('#freePlay');
  btn.classList.toggle('stop', !!live);
  btn.innerHTML = live ? `${ICON.stop}<span>停止</span>` : `${ICON.play}<span>再生</span>`;
  const now = $('#freeNow');
  now.hidden = !(active && src?.kind === 'song');
  if (!now.hidden) now.textContent = `再生中: ${src.title}（${src.bpm} BPM）`;
  ensureDots($('#freeBeats'), active && src?.kind === 'free' ? src : toEngine(S.free));
}

// 下端に固定したバー（セトリ＝プレイヤー、フリー＝再生ボタン）の高さぶん本文に余白を取る
function measureDock() {
  const bar = ui.view === 'free' ? $('#freeBar') : $('#dock');
  document.documentElement.style.setProperty('--dock-h', bar.hidden ? '0px' : bar.offsetHeight + 'px');
}

/* ================= 再生操作 ================= */
function playSong(song, setlistId = cur().id) {
  ui.cuedId = song.id;
  Engine.start({ kind: 'song', setlistId, songId: song.id, title: song.title, ...toEngine(song) });
}
function toggleSong(song) {
  if (playingSongId() === song.id) Engine.stop();
  else playSong(song);
}
function dockPlay() {
  if (liveSrc()) { Engine.stop(); return; }
  const sl = cur();
  const s = sl.songs.find(x => x.id === ui.cuedId) || sl.songs[0];
  if (s) playSong(s);
}
function step(d) {
  const sl = cur();
  if (!sl.songs.length) return;
  const i = baseIndex();
  const j = clamp(i < 0 ? 0 : i + d, 0, sl.songs.length - 1);
  if (i >= 0 && i === j) return;
  const song = sl.songs[j];
  if (Engine.active && Engine.src?.kind === 'song') playSong(song);
  else { ui.cuedId = song.id; renderDock(); updateMarks(); }
  scrollToSong(song.id);
}
function scrollToSong(id) {
  const li = $(`#songList li[data-id="${id}"]`);
  if (li) li.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
// ± ：再生中だけ。曲には保存しない（止めて再生し直すと曲の BPM に戻る）。フリーは設定として覚える
function nudge(d) {
  if (ui.view === 'free') { freeTempo?.setBpm(S.free.bpm + d); return; }
  const src = liveSrc();
  if (!src) return;
  Engine.setBpm(src.bpm + d);
  if (src.kind === 'free') { S.free.bpm = Engine.src.bpm; save(); renderFree(); }
}
function freeToggle() {
  freeTempo?.flush();
  if (liveSrc()) { Engine.stop(); return; }
  Engine.start({ kind: 'free', title: 'フリー', ...toEngine(S.free) });
}
function showSetlist(id) {
  if (ui.view === 'setlist' && S.currentId === id) return;
  S.currentId = id; ui.view = 'setlist'; ui.edit = false; ui.cuedId = null;
  save(); render(); window.scrollTo({ top: 0 });
}

/* ================= 描画ループ（拍の表示） ================= */
let rafOn = false;
const flashEl = $('#flash');
function ensureRaf() { if (!rafOn) { rafOn = true; requestAnimationFrame(frame); } }
function frame() {
  const n = Engine.pull();
  if (n) onBeat(n);
  if (Engine.active) requestAnimationFrame(frame);
  else { rafOn = false; clearDots(); }
}
function onBeat(n) {
  const el = ui.view === 'free' ? $('#freeBeats') : $('#dockBeats');
  const dots = el.children;
  for (let i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === n.dot);
  const dot = dots[n.dot];
  if (dot && dot.animate) dot.animate([{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 150, easing: 'ease-out' });
  if (S.settings.flash && n.kind !== 'sub' && flashEl.animate) {
    flashEl.animate([{ opacity: n.kind === 'accent' ? 0.55 : 0.2 }, { opacity: 0 }], { duration: 170, easing: 'ease-out' });
  }
}
Engine.on(() => {
  renderDock(); updateMarks(); renderFree();
  if (Engine.active) ensureRaf();
});

/* ================= 小物 ================= */
function holdRepeat(btn, fn) {
  let t1 = 0, t2 = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
  btn.addEventListener('pointerdown', e => {
    if (e.button !== 0 || btn.disabled) return;
    e.preventDefault(); stop(); fn();
    t1 = setTimeout(() => { t2 = setInterval(() => { if (btn.disabled) stop(); else fn(); }, 70); }, 420);
    try { btn.setPointerCapture(e.pointerId); } catch {}
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); }); // キーボード操作
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
// 再生系のボタン：指を離した時（click）ではなく押した瞬間（pointerdown）に動かす。
// ただし音声がまだ起動していない時（アプリを開いて最初の1回など）は、ブラウザの自動再生制限で
// タッチの押し下げからは音を出せないため、従来どおり離した時の click で動かす
function pressAction(btn, fn) {
  let handled = false;
  btn.addEventListener('pointerdown', e => {
    handled = false;
    if (e.button !== 0 || btn.disabled || !Engine.ready) return;
    handled = true; fn();
  });
  // detail 0 はキーボード操作。押し下げで処理済みなら、続く click は捨てる
  btn.addEventListener('click', e => { if (e.detail === 0 || !handled) fn(); handled = false; });
}
function makeTapper(onBpm) {
  let taps = [];
  return () => {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2200) taps = [];
    taps.push(now);
    if (taps.length > 8) taps.shift();
    if (taps.length >= 2) onBpm(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
  };
}

/* ---------- ミキサー（全曲共通・1つだけ） ----------
   音量（つまみの量）は触ると自動保存（S.settings.levels）。
   ON/OFF は保存しない：起動時はいつも 1拍目と表だけ ON。つまみを回すか ON/OFF キーを押したレイヤーだけ ON になる。
   ドックとフリーのミキサーは同じ状態を表示・操作する。曲ごとの設定は持たない（2026-09-20 Koki 決定） */
const layerOn = { accent: true, beat: true, e8: false, t3: false, s16: false };
const effMix = () => Object.fromEntries(MIX_KEYS.map(k => [k, layerOn[k] ? S.settings.levels[k] : 0]));
function mixChanged() {
  if (Engine.active && Engine.src) Engine.setMix(effMix()); // 鳴っていれば即反映（emit で再描画される）
  else { renderDock(); renderFree(); }
}
function setLevel(k, v) {
  S.settings.levels[k] = v;
  layerOn[k] = v > 0; // 回したら ON、0 まで絞ったら OFF
  save(); mixChanged();
}
function toggleLayer(k) {
  layerOn[k] = !layerOn[k];
  if (layerOn[k] && S.settings.levels[k] <= 0) { S.settings.levels[k] = 0.7; save(); }
  mixChanged();
}

// ノブを上下（右左）にドラッグ／ホイールで音量（5%刻み）、下の ON/OFF キーで鳴らす・止める
// 0〜100% をノブの -135°〜+135° に割り当てる（アナログ機材と同じ 270° 可動）
const KNOB_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <circle class="k-arc-bg" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 50 50)"/>
  <circle class="k-arc" cx="50" cy="50" r="45" pathLength="100" transform="rotate(135 50 50)" filter="url(#kGlow)"/>
  <circle cx="50" cy="53" r="34" fill="rgba(0,0,0,.55)"/>
  <circle cx="50" cy="50" r="33" fill="url(#kSkirt)"/>
  <circle class="k-rot" cx="50" cy="50" r="31" fill="none" stroke="#0c0d10" stroke-width="3.2" stroke-dasharray="1.2 2.2" opacity=".8"/>
  <circle cx="50" cy="50" r="24" fill="url(#kCap)"/>
  <circle cx="50" cy="50" r="24" fill="url(#kShine)"/>
  <line class="k-rot k-ptr" x1="50" y1="29" x2="50" y2="40"/>
</svg>`;
// ノブは保存済みの音量を常に指し、OFF のレイヤーはリングを暗くする
function renderMixer(el, ts) {
  const kind = kindOf(ts);
  if (el.dataset.kind !== kind) {
    el.dataset.kind = kind;
    el.style.gridTemplateColumns = `repeat(${LAYERS[kind].length}, minmax(0, 1fr))`;
    el.innerHTML = LAYERS[kind].map(([k, l]) => `
      <div class="knob-cell" data-k="${k}">
        <div class="knob" data-k="${k}" role="slider" tabindex="0" aria-label="${l}の音量" aria-valuemin="0" aria-valuemax="100">${KNOB_SVG}</div>
        <button type="button" class="mute" data-k="${k}" aria-label="${l}をオン/オフ">${l}</button>
        <span class="knob-val"></span>
      </div>`).join('');
  }
  for (const c of el.querySelectorAll('.knob-cell')) {
    const k = c.dataset.k, v = S.settings.levels[k] ?? 0, on = layerOn[k], pct = Math.round(v * 100);
    const kn = c.querySelector('.knob');
    const rot = `rotate(${(-135 + 270 * v).toFixed(1)} 50 50)`;
    kn.querySelectorAll('.k-rot').forEach(g => g.setAttribute('transform', rot));
    const arc = kn.querySelector('.k-arc');
    arc.setAttribute('stroke-dasharray', `${(75 * v).toFixed(2)} 100`);
    arc.style.opacity = v <= 0 ? 0 : on ? 1 : 0.25;
    kn.setAttribute('aria-valuenow', pct);
    c.querySelector('.knob-val').textContent = pct;
    c.querySelector('.mute').setAttribute('aria-pressed', String(on));
  }
}
// el ごとに1回だけ呼ぶ
function attachMixer(el) {
  let drag = null;
  const q5 = v => clamp(Math.round(v * 20) / 20, 0, 1);
  const level = k => S.settings.levels[k] ?? 0;
  el.addEventListener('pointerdown', e => {
    const kn = e.target.closest('.knob');
    if (!kn || e.button !== 0) return;
    e.preventDefault();
    drag = { k: kn.dataset.k, x: e.clientX, y: e.clientY, v: level(kn.dataset.k) };
    try { kn.setPointerCapture(e.pointerId); } catch {}
  });
  // DAW と同じく「上へドラッグで右回り」。140px で 0→100%。右方向も少し効かせる
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const v = q5(drag.v + ((drag.y - e.clientY) + (e.clientX - drag.x) * 0.5) / 140);
    if (v !== level(drag.k) || !layerOn[drag.k]) setLevel(drag.k, v);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, () => { drag = null; }));
  el.addEventListener('wheel', e => {
    const kn = e.target.closest('.knob');
    if (!kn) return;
    e.preventDefault();
    setLevel(kn.dataset.k, q5(level(kn.dataset.k) + (e.deltaY < 0 ? 0.05 : -0.05)));
  }, { passive: false });
  el.addEventListener('keydown', e => {
    const kn = e.target.closest('.knob');
    if (!kn) return;
    const v = level(kn.dataset.k);
    const n = { ArrowUp: v + 0.05, ArrowRight: v + 0.05, ArrowDown: v - 0.05, ArrowLeft: v - 0.05, Home: 0, End: 1 }[e.key];
    if (n === undefined) return;
    e.preventDefault(); e.stopPropagation();
    setLevel(kn.dataset.k, q5(n));
  });
  el.addEventListener('click', e => {
    const b = e.target.closest('.mute');
    if (b) toggleLayer(b.dataset.k);
  });
}

// model = { bpm, ts } を画面の操作と結びつける。onChange(field) で呼び出し側に通知。ミキサーがあれば共通ミキサーを表示
function bindTempo(root, model, onChange) {
  const q = s => root.querySelector(s);
  const bpmIn = q('[data-t="bpm"]'), range = q('[data-t="range"]'), tapBtn = q('[data-t="tap"]'), mixerEl = q('[data-t="mixer"]');
  const digits = q('[data-t="digits"]');
  const sync = () => {
    if (document.activeElement !== bpmIn) bpmIn.value = model.bpm;
    range.value = model.bpm;
    if (digits.dataset.v !== String(model.bpm)) { digits.dataset.v = model.bpm; digits.innerHTML = seg7(model.bpm, 3); }
    q('[data-t="unit"]').textContent = UNIT_LABEL[kindOf(model.ts)];
    root.querySelectorAll('[data-t="ts"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === model.ts)));
    if (mixerEl) renderMixer(mixerEl, model.ts);
  };
  if (mixerEl) attachMixer(mixerEl);
  const setBpm = v => {
    const b = clampBpm(v);
    if (b === model.bpm) { sync(); return; }
    model.bpm = b; sync(); onChange('bpm');
  };
  // iOS ではボタンを押しても入力欄のフォーカスが外れないことがあるので、保存・再生の前に明示的に読む
  const flush = () => {
    const raw = bpmIn.value, v = Number(raw);
    if (raw !== '' && Number.isFinite(v)) setBpm(v);
    bpmIn.value = model.bpm;
  };
  bpmIn.addEventListener('change', flush);
  bpmIn.addEventListener('keydown', e => { if (e.key === 'Enter') bpmIn.blur(); });
  bpmIn.addEventListener('focus', () => bpmIn.select());
  range.addEventListener('input', () => setBpm(range.value));
  root.querySelectorAll('[data-t="step"]').forEach(b => holdRepeat(b, () => setBpm(model.bpm + Number(b.dataset.d))));
  root.querySelectorAll('[data-t="ts"]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.v === model.ts) return;
    model.ts = b.dataset.v;
    sync(); onChange('ts');
  }));
  const tapper = makeTapper(v => setBpm(v));
  let hitTimer = 0;
  const hit = () => { tapper(); tapBtn.classList.add('hit'); clearTimeout(hitTimer); hitTimer = setTimeout(() => tapBtn.classList.remove('hit'), 110); };
  tapBtn.addEventListener('pointerdown', e => { if (e.button !== 0) return; e.preventDefault(); hit(); });
  tapBtn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) hit(); } });
  sync();
  return { sync, flush, setBpm };
}

let toastTimer = 0;
function toast(msg, { action, onAction } = {}) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action)}</button>` : ''}`;
  el.hidden = false;
  if (action) el.querySelector('button').onclick = () => { el.hidden = true; onAction(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 2600);
}

/* ================= シート ================= */
let sheet = null;
function openSheet(html, opts = {}) {
  closeSheet();
  const root = document.createElement('div');
  root.className = 'sheet-root';
  root.innerHTML = `<div class="sheet-backdrop"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div>${html}</div>`;
  document.body.appendChild(root);
  root.querySelector('.sheet-backdrop').addEventListener('click', () => closeSheet());
  sheet = { root, opts, prevFocus: document.activeElement };
  document.body.classList.add('sheet-open');
  return root.querySelector('.sheet');
}
function closeSheet() {
  if (!sheet) return;
  const { root, opts, prevFocus } = sheet;
  sheet = null;
  root.remove();
  document.body.classList.remove('sheet-open');
  opts.onClose?.();
  if (prevFocus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
}
function dialog({ title, message = '', input = null, ok = 'OK', danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const el = openSheet(`
      <div class="dlg">
        <h2 class="dlg-title">${esc(title)}</h2>
        ${message ? `<p class="dlg-msg">${esc(message)}</p>` : ''}
        ${input !== null ? '<input class="input" data-x="in" maxlength="60" autocomplete="off" enterkeyhint="done">' : ''}
        <div class="dlg-actions"><button class="ghost-btn" data-x="no">キャンセル</button><button class="fill-btn${danger ? ' danger' : ''}" data-x="ok">${esc(ok)}</button></div>
      </div>`, { onClose: () => { if (!done) resolve(null); } });
    const inp = el.querySelector('[data-x="in"]');
    const accept = () => {
      const v = inp ? inp.value.trim() : true;
      if (inp && !v) { inp.focus(); return; }
      done = true; closeSheet(); resolve(v);
    };
    if (inp) {
      inp.value = input;
      setTimeout(() => { inp.focus(); inp.select(); }, 60);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) accept(); });
    }
    el.querySelector('[data-x="ok"]').addEventListener('click', accept);
    el.querySelector('[data-x="no"]').addEventListener('click', () => closeSheet());
  });
}

function openEditor(songId, preset = null) {

  const previewBtn = el.querySelector('[data-x="preview"]');
  titleIn.value = draft.title; noteIn.value = draft.note;
  [titleIn, noteIn].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) i.blur(); }));
  const previewing = () => Engine.active && Engine.src?.kind === 'preview';
  const startPreview = () => Engine.start({ kind: 'preview', title: draft.title, ...toEngine(draft) });
  const syncPreview = () => {
    previewBtn.innerHTML = previewing() ? `${ICON.stop}<span>試聴を止める</span>` : `${ICON.play}<span>試聴</span>`;
    previewBtn.classList.toggle('on', previewing());
  };
  const off = Engine.on(syncPreview);
  const tempo = bindTempo(el, draft, field => {
    if (!previewing()) return;
    if (field === 'bpm') Engine.setBpm(draft.bpm);
    else startPreview();
  });
  previewBtn.addEventListener('click', () => {
    tempo.flush();
    if (previewing()) Engine.stop(); else startPreview();
  });
  syncPreview();
  if (!orig) setTimeout(() => titleIn.focus(), 80);

  el.querySelector('[data-x="cancel"]').addEventListener('click', () => closeSheet());
  el.querySelector('[data-x="save"]').addEventListener('click', () => {
    tempo.flush();
    draft.title = titleIn.value.trim().slice(0, 80) || '無題';
    draft.note = noteIn.value.trim().slice(0, 140);
    let target = orig;
    if (orig) Object.assign(orig, draft);
    else { target = { ...draft }; sl.songs.push(target); ui.cuedId = target.id; }
    save();
    const src = Engine.src;
    const wasPlayingThis = Engine.active && src?.kind === 'song' && src.songId === target.id;
    closeSheet();
    if (wasPlayingThis) {
      if (src.ts !== target.ts) playSong(target, sl.id); // 拍子が変わったら頭から
      else {
        src.title = target.title;
        Engine.setBpm(target.bpm);
      }
    }
    if (preset) ui.view = 'setlist';
    render();
    if (!orig) setTimeout(() => scrollToSong(target.id), 50);
  });
  el.querySelector('[data-x="delete"]')?.addEventListener('click', () => {
    const i = sl.songs.indexOf(orig);
    if (i < 0) return;
    sl.songs.splice(i, 1);
    if (playingSongId() === orig.id) Engine.stop();
    save(); closeSheet(); render();
    toast(`「${orig.title}」を削除しました`, { action: '元に戻す', onAction: () => {
      sl.songs.splice(Math.min(i, sl.songs.length), 0, orig); save(); render();
    } });
  });
}

/* ---------- まとめて追加 ---------- */
// 1行1曲。「曲名 BPM」＋任意で拍子（3/4・6/8…）と裏（8分・16分・3連）。番号・全角数字・カンマ区切りも許す
function parseBulk(text) {
  const out = [];
  for (let line of String(text).split(/\r?\n/)) {
    line = line.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/／/g, '/').replace(/[,，、\t　]/g, ' ').trim()
      .replace(/^\d{1,3}\s*[.)．）:：]\s*/, '');
    if (!line) continue;
    const toks = line.split(/\s+/);
    let ts = '4/4', bpmAt = -1, bpm = null;
    const subs = [];
    const skip = new Set();
    toks.forEach((tok, i) => {
      if (METERS.includes(tok)) { ts = tok; skip.add(i); }
      else if (/^(8分裏?|裏|8th)$/i.test(tok)) { subs.push('8th'); skip.add(i); }
      else if (/^(16分|16th)$/i.test(tok)) { subs.push('16th'); skip.add(i); }
      else if (/^(3連|三連)$/.test(tok)) { subs.push('triplet'); skip.add(i); }
    });
    for (let i = toks.length - 1; i >= 0; i--) {
      if (skip.has(i)) continue;
      const m = toks[i].match(/^(?:bpm|♩=?|=)?(\d{2,3})(?:bpm)?$/i);
      if (m && Number(m[1]) >= BPM_MIN && Number(m[1]) <= BPM_MAX) { bpm = Number(m[1]); bpmAt = i; break; }
    }
    const title = toks.filter((_, i) => i !== bpmAt && !skip.has(i)).join(' ').slice(0, 80) || '無題';
    // 書かれた裏はすべてオン（重ねて鳴らせる）。何も書かなければその拍子の定番
    const mix = subs.length
      ? subs.map(x => mixFromSub(ts, x)).reduce((a, b) => ({ ...a, e8: Math.max(a.e8, b.e8), t3: Math.max(a.t3, b.t3), s16: Math.max(a.s16, b.s16) }))
      : defaultMix(ts);
    out.push({ title, bpm: bpm ?? 120, noBpm: bpm === null, ts });
  }
  return out;
}
function openBulk() {
  const sl = cur();
  const el = openSheet(`
    <div class="sheet-head"><button class="text-btn" data-x="cancel">キャンセル</button><h2>まとめて追加</h2><button class="text-btn primary" data-x="add">追加</button></div>
    <div class="stack">
      <p class="hint" style="margin:0">「${esc(sl.name)}」の最後に追加します。1行に1曲、<b>曲名 BPM</b> の順で書いてください。拍子（3/4・6/8 など）も書けます。</p>
      <textarea class="input" data-x="text" rows="7" placeholder="1曲目 168&#10;2曲目 185 8分&#10;3曲目 92 3/4&#10;バラード 58 6/8"></textarea>
      <ul class="parse-list" data-x="list"></ul>
    </div>`);
  const ta = el.querySelector('[data-x="text"]'), list = el.querySelector('[data-x="list"]'), addBtn = el.querySelector('[data-x="add"]');
  const update = () => {
    const rows = parseBulk(ta.value);
    list.innerHTML = rows.map(r => `<li><span class="t">${esc(r.title)}</span><span class="m${r.noBpm ? ' warn' : ''}">${r.noBpm ? 'BPMなし→120' : r.bpm} ・ ${esc(meterText(r))}</span></li>`).join('');
    addBtn.textContent = rows.length ? `${rows.length}曲を追加` : '追加';
    addBtn.disabled = !rows.length;
    return rows;
  };
  ta.addEventListener('input', update);
  update();
  setTimeout(() => ta.focus(), 80);
  el.querySelector('[data-x="cancel"]').addEventListener('click', () => closeSheet());
  addBtn.addEventListener('click', () => {
    const rows = update();
    if (!rows.length) return;
    const first = rows[0];
    for (const r of rows) sl.songs.push({ id: uid(), title: r.title, bpm: r.bpm, ts: r.ts, note: '' });
    save(); closeSheet(); render();
    toast(`${rows.length}曲を追加しました`);
    const firstNew = sl.songs[sl.songs.length - rows.length];
    if (firstNew && first) setTimeout(() => scrollToSong(firstNew.id), 50);
  });
}

    const lists = decodeShared(el.querySelector('[data-x="link"]').value);
    if (!lists) { toast('共有リンクを読み取れませんでした'); return; }
    closeSheet();
    importSetlists(lists, false);
  });
}
async function setlistAction(x) {
  const sl = cur(), i = S.setlists.indexOf(sl);
  if (x === 'rename') {
    const name = await dialog({ title: 'セトリの名前', input: sl.name, ok: '変更' });
    if (name) { sl.name = name.slice(0, 60); save(); render(); }
  } else if (x === 'dup') {
    const c = { id: uid(), name: uniqueName(`${sl.name}（コピー）`), songs: sl.songs.map(s => ({ ...s, id: uid() })) };
    S.setlists.splice(i + 1, 0, c); S.currentId = c.id;
    save(); render(); toast('複製しました');
  } else if (x === 'share') {
    shareSetlist(sl);
  } else if (x === 'left' || x === 'right') {
    const j = x === 'left' ? i - 1 : i + 1;
    if (j < 0 || j >= S.setlists.length) return;
    [S.setlists[i], S.setlists[j]] = [S.setlists[j], S.setlists[i]];
    save(); render();
  } else if (x === 'del') {
    const ok = await dialog({ title: `「${sl.name}」を削除しますか？`, message: `${sl.songs.length}曲がすべて消えます。元に戻せません。`, ok: '削除', danger: true });
    if (!ok) return;
    if (Engine.active && Engine.src?.setlistId === sl.id) Engine.stop();
    S.setlists.splice(i, 1);
    if (!S.setlists.length) S.setlists.push({ id: uid(), name: 'セトリ1', songs: [] });
    S.currentId = S.setlists[Math.max(0, i - 1)].id;
    ui.cuedId = null; ui.edit = false;
    save(); render(); toast('削除しました');
  }
}

/* ---------- 共有・バックアップ ---------- */
function b64uEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
// 共有リンク。1件は #import=（v1.1 以前とも互換）、複数件は #importAll=（旧版は無視するので誤読しない）
function decodeShared(text) {
  const m = String(text).match(/#import(?:All)?=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const p = JSON.parse(b64uDecode(m[1]));
    // 4番目は v1.4 以降ミックス配列 [1拍目, 表, 8分, 3連, 16分]（0〜100）、それ以前は裏のキー文字列
    const song = a => ({ title: a[0], bpm: a[1], ts: a[2], mix: Array.isArray(a[3]) ? a[3] : undefined, sub: typeof a[3] === 'string' ? a[3] : undefined, note: a[4] });
    const toList = x => sanitizeSetlist({ name: x?.n, songs: (Array.isArray(x?.s) ? x.s : []).map(song) });
    const lists = (Array.isArray(p.L) ? p.L : [p]).map(toList).filter(Boolean);
    return lists.length ? lists : null;
  } catch { return null; }
}
function shareUrl(lists) {
  const pack = l => ({ n: l.name, s: l.songs.map(s => [s.title, s.bpm, s.ts, 'none', s.note]) });
  const multi = lists.length > 1;
  const payload = multi ? { v: 3, L: lists.map(pack) } : { v: 2, ...pack(lists[0]) };
  return `${location.origin}${location.pathname}#${multi ? 'importAll' : 'import'}=${b64uEncode(JSON.stringify(payload))}`;
}
const shareSetlist = sl => shareLists([sl]);
async function shareLists(lists) {
  const url = shareUrl(lists);
  const total = lists.reduce((n, l) => n + l.songs.length, 0);
  const text = lists.length === 1 ? `SetClick のセトリ「${lists[0].name}」（${total}曲）` : `SetClick のセトリ${lists.length}件（計${total}曲）`;
  if (navigator.share) {
    try { await navigator.share({ title: text, text, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('共有リンクをコピーしました'); }
  catch { await dialog({ title: '共有リンク', message: 'コピーして送ってください', input: url, ok: '閉じる' }); }
}
async function importSetlists(lists, ask = true) {
  const total = lists.reduce((n, l) => n + l.songs.length, 0);
  if (ask) {
    const one = lists.length === 1;
    const ok = await dialog({
      title: one ? `「${lists[0].name}」を取り込みますか？` : `${lists.length}件のセトリを取り込みますか？`,
      message: `${one ? '' : lists.map(l => l.name).join('、') + '　'}計${total}曲。新しいセトリとして追加します（今あるセトリはそのまま）。`,
      ok: '取り込む',
    });
    if (!ok) return;
  }
  for (const sl of lists) {
    sl.id = uid(); sl.songs.forEach(s => { s.id = uid(); });
    sl.name = uniqueName(sl.name);
    S.setlists.push(sl);
  }
  S.currentId = lists[0].id; ui.view = 'setlist'; ui.cuedId = null; ui.edit = false;
  save(); render(); window.scrollTo({ top: 0 });
  toast(lists.length === 1 ? `「${lists[0].name}」を取り込みました` : `${lists.length}件のセトリを取り込みました`);
}
function handleImportHash() {
  if (!/^#import(All)?=/.test(location.hash)) return;
  const lists = decodeShared(location.hash);
  history.replaceState(null, '', location.pathname + location.search);
  if (!lists) { toast('共有リンクを読み込めませんでした'); return; }
  importSetlists(lists, true);
}
function exportBackup() {
  const data = JSON.stringify({ app: 'setclick', v: 2, exportedAt: new Date().toISOString(), setlists: S.setlists }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const d = new Date();
  a.download = `setclick-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importBackup(file) {
  let lists = [];
  try {
    const d = JSON.parse(await file.text());
    lists = (Array.isArray(d?.setlists) ? d.setlists : []).map(sanitizeSetlist).filter(Boolean);
  } catch {}
  if (!lists.length) { toast('ファイルを読み込めませんでした'); return; }
  const ok = await dialog({ title: `${lists.length}件のセトリを取り込みますか？`, message: '今あるセトリはそのまま残り、後ろに追加されます。', ok: '取り込む' });
  if (!ok) return;
  for (const l of lists) {
    l.id = uid(); l.songs.forEach(s => { s.id = uid(); }); l.name = uniqueName(l.name);
    S.setlists.push(l);
  }
  save(); render(); toast(`${lists.length}件取り込みました`);
}

/* ---------- 設定 ---------- */
function openSettings() {
  const st = S.settings;
  const el = openSheet(`
    <div class="sheet-head"><span></span><h2>設定</h2><button class="text-btn" data-x="close">閉じる</button></div>
    <div class="stack">
      <div class="field"><div class="field-label">音色</div><div class="seg" data-g="sound">${SOUNDS.map(o => `<button type="button" data-v="${o.v}">${o.label}</button>`).join('')}</div></div>
      <div class="field"><div class="field-label">音量</div>
        <div class="slider-row"><span>全体</span><input type="range" min="0" max="100" step="1" data-k="volume" aria-label="全体の音量"><span class="v num" data-v="volume"></span></div>
      </div>
      <div class="field"><div class="field-label">セトリ再生のカウント</div>
        <div class="seg" data-g="count">${COUNT_MODES.map(o => `<button type="button" data-v="${o.v}">${o.label}</button>`).join('')}</div>
        <p class="hint">「1小節で停止」はテンポを耳に入れてからカウントを出すとき用。フリーでは常に鳴らし続けます。</p>
      </div>
      <div class="field"><div class="field-label">画面フラッシュ<span>拍に合わせて画面が光る</span></div>
        <div class="seg" data-g="flash"><button type="button" data-v="0">オフ</button><button type="button" data-v="1">オン</button></div>
      </div>
      <div class="field"><div class="field-label">バックアップ</div>
        <div class="two"><button type="button" class="ghost-btn" data-x="export">書き出し</button><button type="button" class="ghost-btn" data-x="import">読み込み</button></div>
        <input type="file" accept="application/json,.json" data-x="file" hidden>
        <button type="button" class="ghost-btn" data-x="shareall" style="margin-top:8px">全セトリをリンクで共有</button>
        <p class="hint">データはこの端末のブラウザ内だけに保存されています。機種変更の前や、たまに書き出しておくと安心です。全セトリの共有リンクは、別の端末やメンバーへの一括コピーにも使えます。</p>
      </div>
      <div>
        <p class="hint center">SetClick v${APP_VERSION}</p>
        <p class="hint center kbd-only">Space: 再生・停止　←→: 曲送り　↑↓: テンポ</p>
      </div>
    </div>`);
  const vol = el.querySelector('input[data-k="volume"]');
  const sync = () => {
    el.querySelectorAll('[data-g="sound"] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.sound)));
    el.querySelectorAll('[data-g="count"] button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === st.countBars)));
    el.querySelectorAll('[data-g="flash"] button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === st.flash)));
    vol.value = Math.round(st.volume * 100);
    el.querySelector('[data-v="volume"]').textContent = `${vol.value}%`;
  };
  sync();
  const changed = () => { save(); sync(); renderDock(); renderFree(); };
  vol.addEventListener('input', () => { st.volume = Number(vol.value) / 100; Engine.setVolume(); changed(); });
  // 止まっているときは離した瞬間に1音鳴らして確認できるように
  vol.addEventListener('change', () => { if (!Engine.active) Engine.blip(); });
  el.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const g = b.closest('[data-g]')?.dataset.g;
    if (g === 'sound') { st.sound = b.dataset.v; changed(); if (!Engine.active) Engine.blip(); return; }
    if (g === 'count') { st.countBars = Number(b.dataset.v); changed(); return; }
    if (g === 'flash') { st.flash = b.dataset.v === '1'; changed(); return; }
    const x = b.dataset.x;
    if (x === 'export') exportBackup();
    else if (x === 'shareall') shareLists(S.setlists);
    else if (x === 'import') el.querySelector('[data-x="file"]').click();
    else if (x === 'close') closeSheet();
  });
  el.querySelector('[data-x="file"]').addEventListener('change', e => {
    const f = e.target.files?.[0];
    if (f) importBackup(f);
  });
}

/* ================= イベント ================= */
$('#songList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const li = btn.closest('li[data-id]');
  const sl = cur();
  const i = sl.songs.findIndex(s => s.id === li.dataset.id);
  if (i < 0) return;
  const song = sl.songs[i];
  const act = btn.dataset.act;
  if (act === 'toggle') toggleSong(song);
  else if (act === 'edit') openEditor(song.id);
  else if (act === 'up' || act === 'down') {
    const j = act === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= sl.songs.length) return;
    [sl.songs[i], sl.songs[j]] = [sl.songs[j], sl.songs[i]];
    save(); renderList(); renderDock();
    const again = $(`#songList li[data-id="${song.id}"] [data-act="${act}"]`);
    if (again && !again.disabled) again.focus({ preventScroll: true });
    scrollToSong(song.id);
  }
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.x === 'new') openNewSetlist();
  else if (b.dataset.view === 'free') { if (ui.view !== 'free') { ui.view = 'free'; ui.edit = false; render(); window.scrollTo({ top: 0 }); } }
  else if (b.dataset.sl) showSetlist(b.dataset.sl);
});
$('#slTools').addEventListener('click', e => { const b = e.target.closest('button[data-x]'); if (b) setlistAction(b.dataset.x); });
$('#slDelBtn').addEventListener('click', () => setlistAction('del'));
$('#addSongBtn').addEventListener('click', () => openEditor(null));
$('#bulkBtn').addEventListener('click', openBulk);
$('#settingsBtn').addEventListener('click', openSettings);
$('#editBtn').addEventListener('click', () => { ui.edit = !ui.edit; render(); });
pressAction($('#playBtn'), dockPlay);
pressAction($('#prevBtn'), () => step(-1));
pressAction($('#nextBtn'), () => step(1));
holdRepeat($('#bpmMinus'), () => nudge(-1));
holdRepeat($('#bpmPlus'), () => nudge(1));
attachMixer($('#dockMixer'));
pressAction($('#freePlay'), freeToggle);
$('#freeAdd').addEventListener('click', () => { freeTempo.flush(); openEditor(null, { bpm: S.free.bpm, ts: S.free.ts }); });

document.addEventListener('keydown', e => {
  if (sheet) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const t = e.target;
  if (t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
  if ((e.key === ' ' || e.key === 'Enter') && t.closest && t.closest('button')) return;
  if (e.key === ' ') { e.preventDefault(); ui.view === 'free' ? freeToggle() : dockPlay(); }
  else if (e.key === 'ArrowRight' && ui.view === 'setlist') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' && ui.view === 'setlist') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(-1); }
});

const barObserver = new ResizeObserver(measureDock);
barObserver.observe($('#dock'));
barObserver.observe($('#freeBar'));
window.addEventListener('hashchange', handleImportHash);

/* ================= 起動 ================= */
$('#freeTempo').innerHTML = tempoHTML({ mixer: true });
freeTempo = bindTempo($('#freeTempo'), S.free, field => {
  save();
  if (Engine.active && Engine.src?.kind === 'free') {
    if (field === 'bpm') Engine.setBpm(S.free.bpm);
    else Engine.start({ kind: 'free', title: 'フリー', ...toEngine(S.free) });
  }
  renderFree();
});
render();
handleImportHash();
if (DEBUG) window.SetClick = { Engine, get state() { return S; }, ui, parseBulk, toEngine };

if ('serviceWorker' in navigator && (location.protocol === 'https:' || /[?&]sw\b/.test(location.search))) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('新しいバージョンがあります', { action: '再読み込み', onAction: () => location.reload() });
  });
}
</script>

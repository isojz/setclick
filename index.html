async function setlistAction(x) {
  const sl = cur(), i = S.setlists.indexOf(sl);
  if (x === 'rename') {
    const name = await dialog({ title: 'セトリの名前', input: sl.name, ok: '変更' });
    if (name) { sl.name = name.slice(0, 60); save(); render(); }
  } else if (x === 'dup') {
    const c = { id: uid(), name: uniqueName(`${sl.name}（コピー）`), songs: sl.songs.map(s => ({ ...s, id: uid() })) };
    S.setlists.splice(i + 1, 0, c); S.currentId = c.id;
    save(); render(); toast('複製しました');
  } else if (x === 'share') {
    shareSetlist(sl);
  } else if (x === 'left' || x === 'right') {
    const j = x === 'left' ? i - 1 : i + 1;
    if (j < 0 || j >= S.setlists.length) return;
    [S.setlists[i], S.setlists[j]] = [S.setlists[j], S.setlists[i]];
    save(); render();
  } else if (x === 'del') {
    const ok = await dialog({ title: `「${sl.name}」を削除しますか？`, message: `${sl.songs.length}曲がすべて消えます。元に戻せません。`, ok: '削除', danger: true });
    if (!ok) return;
    if (Engine.active && Engine.src?.setlistId === sl.id) Engine.stop();
    S.setlists.splice(i, 1);
    if (!S.setlists.length) S.setlists.push({ id: uid(), name: 'セトリ1', songs: [] });
    S.currentId = S.setlists[Math.max(0, i - 1)].id;
    ui.cuedId = null; ui.edit = false;
    save(); render(); toast('削除しました');
  }
}

/* ---------- 共有・バックアップ ---------- */
function b64uEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
// 共有リンク。1件は #import=（v1.1 以前とも互換）、複数件は #importAll=（旧版は無視するので誤読しない）
function decodeShared(text) {
  const m = String(text).match(/#import(?:All)?=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const p = JSON.parse(b64uDecode(m[1]));
    // 4番目は v1.4 以降ミックス配列 [1拍目, 表, 8分, 3連, 16分]（0〜100）、それ以前は裏のキー文字列
    const song = a => ({ title: a[0], bpm: a[1], ts: a[2], mix: Array.isArray(a[3]) ? a[3] : undefined, sub: typeof a[3] === 'string' ? a[3] : undefined, note: a[4] });
    const toList = x => sanitizeSetlist({ name: x?.n, songs: (Array.isArray(x?.s) ? x.s : []).map(song) });
    const lists = (Array.isArray(p.L) ? p.L : [p]).map(toList).filter(Boolean);
    return lists.length ? lists : null;
  } catch { return null; }
}
function shareUrl(lists) {
  const pack = l => ({ n: l.name, s: l.songs.map(s => [s.title, s.bpm, s.ts, MIX_KEYS.map(k => Math.round((s.mix?.[k] ?? 0) * 100)), s.note]) });
  const multi = lists.length > 1;
  const payload = multi ? { v: 3, L: lists.map(pack) } : { v: 2, ...pack(lists[0]) };
  return `${location.origin}${location.pathname}#${multi ? 'importAll' : 'import'}=${b64uEncode(JSON.stringify(payload))}`;
}
const shareSetlist = sl => shareLists([sl]);
async function shareLists(lists) {
  const url = shareUrl(lists);
  const total = lists.reduce((n, l) => n + l.songs.length, 0);
  const text = lists.length === 1 ? `SetClick のセトリ「${lists[0].name}」（${total}曲）` : `SetClick のセトリ${lists.length}件（計${total}曲）`;
  if (navigator.share) {
    try { await navigator.share({ title: text, text, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('共有リンクをコピーしました'); }
  catch { await dialog({ title: '共有リンク', message: 'コピーして送ってください', input: url, ok: '閉じる' }); }
}
async function importSetlists(lists, ask = true) {
  const total = lists.reduce((n, l) => n + l.songs.length, 0);
  if (ask) {
    const one = lists.length === 1;
    const ok = await dialog({
      title: one ? `「${lists[0].name}」を取り込みますか？` : `${lists.length}件のセトリを取り込みますか？`,
      message: `${one ? '' : lists.map(l => l.name).join('、') + '　'}計${total}曲。新しいセトリとして追加します（今あるセトリはそのまま）。`,
      ok: '取り込む',
    });
    if (!ok) return;
  }
  for (const sl of lists) {
    sl.id = uid(); sl.songs.forEach(s => { s.id = uid(); });
    sl.name = uniqueName(sl.name);
    S.setlists.push(sl);
  }
  S.currentId = lists[0].id; ui.view = 'setlist'; ui.cuedId = null; ui.edit = false;
  save(); render(); window.scrollTo({ top: 0 });
  toast(lists.length === 1 ? `「${lists[0].name}」を取り込みました` : `${lists.length}件のセトリを取り込みました`);
}
function handleImportHash() {
  if (!/^#import(All)?=/.test(location.hash)) return;
  const lists = decodeShared(location.hash);
  history.replaceState(null, '', location.pathname + location.search);
  if (!lists) { toast('共有リンクを読み込めませんでした'); return; }
  importSetlists(lists, true);
}
function exportBackup() {
  const data = JSON.stringify({ app: 'setclick', v: 2, exportedAt: new Date().toISOString(), setlists: S.setlists }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const d = new Date();
  a.download = `setclick-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importBackup(file) {
  let lists = [];
  try {
    const d = JSON.parse(await file.text());
    lists = (Array.isArray(d?.setlists) ? d.setlists : []).map(sanitizeSetlist).filter(Boolean);
  } catch {}
  if (!lists.length) { toast('ファイルを読み込めませんでした'); return; }
  const ok = await dialog({ title: `${lists.length}件のセトリを取り込みますか？`, message: '今あるセトリはそのまま残り、後ろに追加されます。', ok: '取り込む' });
  if (!ok) return;
  for (const l of lists) {
    l.id = uid(); l.songs.forEach(s => { s.id = uid(); }); l.name = uniqueName(l.name);
    S.setlists.push(l);
  }
  save(); render(); toast(`${lists.length}件取り込みました`);
}

/* ---------- 設定 ---------- */
function openSettings() {
  const st = S.settings;
  const el = openSheet(`
    <div class="sheet-head"><span></span><h2>設定</h2><button class="text-btn" data-x="close">閉じる</button></div>
    <div class="stack">
      <div class="field"><div class="field-label">音色</div><div class="seg" data-g="sound">${SOUNDS.map(o => `<button type="button" data-v="${o.v}">${o.label}</button>`).join('')}</div></div>
      <div class="field"><div class="field-label">音量</div>
        <div class="slider-row"><span>全体</span><input type="range" min="0" max="100" step="1" data-k="volume" aria-label="全体の音量"><span class="v num" data-v="volume"></span></div>
        <p class="hint">1拍目・表・8分裏・3連・16分の音量は、再生中に下のプレイヤーのミキサーで曲ごとに調整できます（名前タップでオン/オフ、上下ドラッグで音量、「保存」で曲に記録）。</p>
      </div>
      <div class="field"><div class="field-label">セトリ再生のカウント</div>
        <div class="seg" data-g="count">${COUNT_MODES.map(o => `<button type="button" data-v="${o.v}">${o.label}</button>`).join('')}</div>
        <p class="hint">「1小節で停止」はテンポを耳に入れてからカウントを出すとき用。フリーでは常に鳴らし続けます。</p>
      </div>
      <div class="toggle-row"><div><div class="t">画面フラッシュ</div><p class="hint">拍に合わせて画面が光る（音が聞き取りにくいステージ用）</p></div><button type="button" class="switch" role="switch" data-x="flash" aria-label="画面フラッシュ"></button></div>
      <div class="field"><div class="field-label">バックアップ</div>
        <div class="two"><button type="button" class="ghost-btn" data-x="export">書き出し</button><button type="button" class="ghost-btn" data-x="import">読み込み</button></div>
        <input type="file" accept="application/json,.json" data-x="file" hidden>
        <button type="button" class="ghost-btn" data-x="shareall" style="margin-top:8px">全セトリをリンクで共有</button>
        <p class="hint">データはこの端末のブラウザ内だけに保存されています。機種変更の前や、たまに書き出しておくと安心です。全セトリの共有リンクは、別の端末やメンバーへの一括コピーにも使えます。</p>
      </div>
      <div>
        <p class="hint center">SetClick v${APP_VERSION}</p>
        <p class="hint center kbd-only">Space: 再生・停止　←→: 曲送り　↑↓: テンポ</p>
      </div>
    </div>`);
  const vol = el.querySelector('input[data-k="volume"]');
  const sync = () => {
    el.querySelectorAll('[data-g="sound"] button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st.sound)));
    el.querySelectorAll('[data-g="count"] button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === st.countBars)));
    el.querySelector('[data-x="flash"]').setAttribute('aria-checked', String(st.flash));
    vol.value = Math.round(st.volume * 100);
    el.querySelector('[data-v="volume"]').textContent = `${vol.value}%`;
  };
  sync();
  const changed = () => { save(); sync(); renderDock(); renderFree(); };
  vol.addEventListener('input', () => { st.volume = Number(vol.value) / 100; Engine.setVolume(); changed(); });
  // 止まっているときは離した瞬間に1音鳴らして確認できるように
  vol.addEventListener('change', () => { if (!Engine.active) Engine.blip(); });
  el.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const g = b.closest('[data-g]')?.dataset.g;
    if (g === 'sound') { st.sound = b.dataset.v; changed(); if (!Engine.active) Engine.blip(); return; }
    if (g === 'count') { st.countBars = Number(b.dataset.v); changed(); return; }
    const x = b.dataset.x;
    if (x === 'flash') { st.flash = !st.flash; changed(); }
    else if (x === 'export') exportBackup();
    else if (x === 'shareall') shareLists(S.setlists);
    else if (x === 'import') el.querySelector('[data-x="file"]').click();
    else if (x === 'close') closeSheet();
  });
  el.querySelector('[data-x="file"]').addEventListener('change', e => {
    const f = e.target.files?.[0];
    if (f) importBackup(f);
  });
}

/* ================= イベント ================= */
$('#songList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const li = btn.closest('li[data-id]');
  const sl = cur();
  const i = sl.songs.findIndex(s => s.id === li.dataset.id);
  if (i < 0) return;
  const song = sl.songs[i];
  const act = btn.dataset.act;
  if (act === 'toggle') toggleSong(song);
  else if (act === 'edit') openEditor(song.id);
  else if (act === 'up' || act === 'down') {
    const j = act === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= sl.songs.length) return;
    [sl.songs[i], sl.songs[j]] = [sl.songs[j], sl.songs[i]];
    save(); renderList(); renderDock();
    const again = $(`#songList li[data-id="${song.id}"] [data-act="${act}"]`);
    if (again && !again.disabled) again.focus({ preventScroll: true });
    scrollToSong(song.id);
  }
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.x === 'new') openNewSetlist();
  else if (b.dataset.view === 'free') { if (ui.view !== 'free') { ui.view = 'free'; ui.edit = false; render(); window.scrollTo({ top: 0 }); } }
  else if (b.dataset.sl) showSetlist(b.dataset.sl);
});
$('#slTools').addEventListener('click', e => { const b = e.target.closest('button[data-x]'); if (b) setlistAction(b.dataset.x); });
$('#addSongBtn').addEventListener('click', () => openEditor(null));
$('#bulkBtn').addEventListener('click', openBulk);
$('#settingsBtn').addEventListener('click', openSettings);
$('#editBtn').addEventListener('click', () => { ui.edit = !ui.edit; render(); });
$('#playBtn').addEventListener('click', dockPlay);
$('#prevBtn').addEventListener('click', () => step(-1));
$('#nextBtn').addEventListener('click', () => step(1));
holdRepeat($('#bpmMinus'), () => nudge(-1));
holdRepeat($('#bpmPlus'), () => nudge(1));
$('#saveBpm').addEventListener('click', saveNudge);
attachMixer($('#dockMixer'), () => Engine.src?.mix, setLiveMix);
$('#freePlay').addEventListener('click', freeToggle);
$('#freeAdd').addEventListener('click', () => { freeTempo.flush(); openEditor(null, { bpm: S.free.bpm, ts: S.free.ts, mix: { ...S.free.mix } }); });

document.addEventListener('keydown', e => {
  if (sheet) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const t = e.target;
  if (t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
  if ((e.key === ' ' || e.key === 'Enter') && t.closest && t.closest('button')) return;
  if (e.key === ' ') { e.preventDefault(); ui.view === 'free' ? freeToggle() : dockPlay(); }
  else if (e.key === 'ArrowRight' && ui.view === 'setlist') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' && ui.view === 'setlist') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(-1); }
});

new ResizeObserver(measureDock).observe($('#dock'));
window.addEventListener('hashchange', handleImportHash);

/* ================= 起動 ================= */
$('#freeTempo').innerHTML = tempoHTML();
freeTempo = bindTempo($('#freeTempo'), S.free, field => {
  save();
  if (Engine.active && Engine.src?.kind === 'free') {
    if (field === 'bpm') Engine.setBpm(S.free.bpm);
    else if (field === 'mix') Engine.setMix(S.free.mix);
    else Engine.start({ kind: 'free', title: 'フリー', ...toEngine(S.free) });
  }
  renderFree();
});
render();
handleImportHash();
if (DEBUG) window.SetClick = { Engine, get state() { return S; }, ui, parseBulk, toEngine };

if ('serviceWorker' in navigator && (location.protocol === 'https:' || /[?&]sw\b/.test(location.search))) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('新しいバージョンがあります', { action: '再読み込み', onAction: () => location.reload() });
  });
}
